name: Push Package to DockerHub

on:
  push:
    branches:
      - feature/cd-dockerhub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - uses: dotnet/nbgv@master
        id: nbgv

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/parserwebapi
          VERSION_TAG=${{ steps.nbgv.outputs.SemVer2 }}

          docker build -t $IMAGE_NAME:$VERSION_TAG -f dotnet/src/ParserWebAPI/Dockerfile dotnet/src/

          docker push $IMAGE_NAME:$VERSION_TAG

          if [ "${{ github.ref_name }}" == "main" ] || [ "${{ github.ref_name }}" == "master" ]; then
            docker tag $IMAGE_NAME:$VERSION_TAG $IMAGE_NAME:latest
            docker push $IMAGE_NAME:latest
          fi
